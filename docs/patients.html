<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NurseSync AI — Patients</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topnav">
    <div class="brand"><span class="dot"></span>NurseSync AI</div>
    <div class="navlinks">
      <a href="dashboard.html">Dashboard</a>
      <a href="patients.html" class="active">Patients</a>
    </div>
    <div class="user-chip">
      <div class="avatar">SR</div>
      Sarah R.
    </div>
  </div>

  <div class="page">
    <h1 class="page-title">Patients</h1>
    <p class="page-sub">All patients currently on your ward.</p>

    <input class="search-bar" type="text" placeholder="Search patient by name...">

    <a href="patient.html">
      <div class="patient-card">
        <div class="patient-info">
          <div class="name">John Smith</div>
          <div class="meta">ICU · Pneumonia</div>
        </div>
        <span class="badge high">HIGH RISK</span>
      </div>
    </a>

    <div class="patient-card">
      <div class="patient-info">
        <div class="name">Emily Brown</div>
        <div class="meta">Ward 3 · Post-op recovery</div>
      </div>
      <span class="badge stable">STABLE</span>
    </div>

    <div class="patient-card">
      <div class="patient-info">
        <div class="name">Michael Lee</div>
        <div class="meta">Ward 5 · Observation</div>
      </div>
      <span class="badge pending">PENDING HANDOFF</span>
    </div>
  </div>
</body>
</html>
