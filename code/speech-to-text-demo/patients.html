<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NurseSync AI — Patients</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="brand"><span class="dot"></span>NurseSync AI</div>
      <div class="navlinks">
        <a href="dashboard.html">Dashboard</a>
        <a href="patients.html" class="active">Patients</a>
      </div>
      <div class="user-chip">
        <div class="avatar">SR</div>
        Sarah R. — RN
      </div>
    </div>

    <div class="page">
      <h1 class="page-title">Patients</h1>
      <p class="page-sub">All patients currently on your ward.</p>

      <input class="search-bar" type="text" id="searchBox" placeholder="Search patient by name...">

      <div id="patientList"></div>
    </div>
  </div>

  <script>
    const PATIENTS = [
      { id: "john-smith", name: "John Smith", initials: "JS", ward: "ICU", diagnosis: "Pneumonia", risk: "high" },
      { id: "emily-brown", name: "Emily Brown", initials: "EB", ward: "Ward 3", diagnosis: "Post-op recovery", risk: "stable" },
      { id: "michael-lee", name: "Michael Lee", initials: "ML", ward: "Ward 5", diagnosis: "Observation", risk: "pending" },
    ];

    const RISK_LABEL = { high: "HIGH RISK", stable: "STABLE", pending: "PENDING HANDOFF" };

    function render(list) {
      document.getElementById('patientList').innerHTML = list.map((p) => `
        <a href="patient.html?id=${p.id}">
          <div class="patient-card">
            <div class="patient-info">
              <div class="patient-avatar">${p.initials}</div>
              <div>
                <div class="name">${p.name}</div>
                <div class="meta">${p.ward} · ${p.diagnosis}</div>
              </div>
            </div>
            <span class="badge ${p.risk}">${RISK_LABEL[p.risk]}</span>
          </div>
        </a>
      `).join('');
    }

    render(PATIENTS);

    document.getElementById('searchBox').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      render(PATIENTS.filter((p) => p.name.toLowerCase().includes(q)));
    });
  </script>
</body>
</html>
